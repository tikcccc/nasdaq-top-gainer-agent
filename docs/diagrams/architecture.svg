<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Product architecture: entry points, agent runtime, external services and local stores</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="18" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#0f172a">Product architecture</text>
  <text x="352" y="50" font-size="15" fill="#64748b">entry points · agent runtime · external services · local stores</text>

  <!-- column headers -->
  <g font-size="12.5" font-weight="700" fill="#64748b" letter-spacing="1.2">
    <text x="40" y="96">ENTRY POINTS</text>
    <text x="300" y="96">SERVICE</text>
    <text x="560" y="96">AGENT RUNTIME</text>
    <text x="880" y="96">EXTERNAL SERVICES</text>
  </g>

  <!-- entry points -->
  <rect x="40" y="120" width="210" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="145" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">CLI</text>
  <text x="145" y="175" font-size="13.5" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">python main.py</text>
  <rect x="40" y="250" width="210" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="145" y="282" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Dashboard</text>
  <text x="145" y="305" font-size="13.5" fill="#475569" text-anchor="middle">web/ · Next.js (optional)</text>

  <!-- service -->
  <rect x="300" y="250" width="210" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="405" y="282" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">FastAPI</text>
  <text x="405" y="305" font-size="13.5" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">nasdaq_agent/api.py</text>
  <rect x="300" y="370" width="210" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="405" y="402" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Job queue</text>
  <text x="405" y="425" font-size="13.5" fill="#475569" text-anchor="middle">jobs.sqlite · leases · resume</text>

  <path d="M250 280 L298 280" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M298 300 L252 300" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="275" y="340" font-size="12" fill="#334155" text-anchor="middle">REST + SSE</text>
  <path d="M405 324 L405 368" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- runtime -->
  <rect x="560" y="120" width="260" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Runner</text>
  <text x="690" y="175" font-size="13.5" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">nasdaq_agent/agent/runner.py</text>
  <path d="M250 157 L558 157" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510 407 L535 407 L535 175 L558 175" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="541" y="300" font-size="12" fill="#334155" transform="rotate(-90 541 300)" text-anchor="middle">worker</text>

  <rect x="560" y="240" width="260" height="210" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="690" y="276" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">LangGraph agent</text>
  <g font-size="14" fill="#134e4a" text-anchor="middle">
    <text x="690" y="306">LLM chooses the 7 tools</text>
    <text x="690" y="332">data checks · ranking status</text>
    <text x="690" y="358">model-written analysis code</text>
    <text x="690" y="384">pre-send guard</text>
    <text x="690" y="410">deterministic fallback</text>
  </g>
  <path d="M690 194 L690 238" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="560" y="500" width="260" height="62" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="690" y="527" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">checkpoints.sqlite</text>
  <text x="690" y="548" font-size="13" fill="#475569" text-anchor="middle">state after every step · --resume</text>
  <path d="M690 450 L690 498" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- external services -->
  <g>
    <rect x="880" y="112" width="290" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="140" font-size="15.5" font-weight="700" fill="#0f172a">Market data &amp; news</text>
    <text x="900" y="165" font-size="13.5" fill="#334155">Yahoo Finance (yfinance) · primary</text>
    <text x="900" y="188" font-size="13.5" fill="#334155">Nasdaq.com API · fallback</text>
    <text x="900" y="211" font-size="13.5" fill="#334155">Google News RSS · news fallback</text>

    <rect x="880" y="246" width="290" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="274" font-size="15.5" font-weight="700" fill="#0f172a">Models</text>
    <text x="900" y="299" font-size="13.5" fill="#334155">MiMo · primary</text>
    <text x="900" y="322" font-size="13.5" fill="#334155">DeepSeek · fallback</text>
    <text x="900" y="345" font-size="13.5" fill="#334155">TypeSafe Jev · sentiment (optional)</text>

    <rect x="880" y="380" width="290" height="74" rx="12" fill="#e0e7ff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="900" y="408" font-size="15.5" font-weight="700" fill="#1f3a5f">Docker sandbox</text>
    <text x="900" y="431" font-size="13.5" fill="#1e293b" font-family="Consolas, Menlo, monospace">nasdaq-analysis:local</text>

    <rect x="880" y="470" width="290" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="498" font-size="15.5" font-weight="700" fill="#0f172a">Email</text>
    <text x="900" y="523" font-size="13.5" fill="#334155">SMTP (smtp.gmail.com by default)</text>
    <text x="900" y="546" font-size="13.5" fill="#334155">dry-run saves .eml instead</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M820 270 L850 270 L850 171 L878 171" marker-end="url(#a)"/>
    <path d="M820 305 L878 305" marker-end="url(#a)"/>
    <path d="M820 380 L850 380 L850 417 L878 417" marker-end="url(#a)"/>
    <path d="M820 430 L840 430 L840 516 L878 516" marker-end="url(#a)"/>
  </g>

  <!-- local stores -->
  <text x="40" y="616" font-size="12.5" font-weight="700" fill="#64748b" letter-spacing="1.2">LOCAL STORES (outputs/, not committed)</text>
  <g font-size="13.5">
    <rect x="40" y="632" width="270" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="58" y="660" font-weight="700" fill="#334155" font-family="Consolas, Menlo, monospace">run_*/</text>
    <text x="58" y="684" fill="#475569">trace · generated code · data</text>
    <text x="58" y="705" fill="#475569">chart · email · summary</text>

    <rect x="330" y="632" width="270" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="348" y="660" font-weight="700" fill="#334155" font-family="Consolas, Menlo, monospace">delivery.sqlite</text>
    <text x="348" y="684" fill="#475569">send ledger: no duplicate sends</text>
    <text x="348" y="705" fill="#475569">on retry or resume</text>

    <rect x="620" y="632" width="270" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="638" y="660" font-weight="700" fill="#334155" font-family="Consolas, Menlo, monospace">usage.sqlite</text>
    <text x="638" y="684" fill="#475569">every model request,</text>
    <text x="638" y="705" fill="#475569">tokens and optional budgets</text>

    <rect x="910" y="632" width="260" height="88" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="928" y="660" font-weight="700" fill="#334155" font-family="Consolas, Menlo, monospace">.cache/</text>
    <text x="928" y="684" fill="#475569">public API responses,</text>
    <text x="928" y="705" fill="#475569">rate-limited and reused</text>
  </g>
</svg>
