# Business parameters for the NASDAQ top-gainer agent.
# Secrets live in .env. Precedence: CLI flags > environment (.env) > this file > code defaults.

analysis:
  days: 5                          # trading days to analyse
  benchmarks:                      # index symbol -> ETF proxy used when the index feed is unavailable
    "^GSPC": SPY
    "^IXIC": QQQ

screener:
  top_n: 10                        # candidates returned to the agent
  default_filters:                 # suggested to the agent; it decides whether to apply them
    exclude_derivatives: true
    min_price: 1                    # product default; users can uncheck the price filter
    min_volume: 100000              # reports explicitly name active filters

data_checks:
  cross_source_warn_pp: 1.0        # screener vs price-history gap (percentage points) that adds a warning
  cross_source_conflict_pp: 5.0    # gap that marks the candidate as data_conflict
  outlier_daily_move: 0.8          # |daily return| above this (outside the trade date) is flagged
  news_max_age_days: 7
  filter_boundary_band: 0.10       # rows within ±10% of a price/volume threshold are checked against the daily bar
                                   # before elimination (engineering default, not yet calibrated)
  max_verification_requests: 12    # per-symbol history requests a screener check may make
  verification_budget_s: 25        # time budget for those requests

llm:
  provider: mimo                   # mimo | deepseek | openai  (env LLM_PROVIDER overrides)
  fallback: [deepseek]             # env LLM_FALLBACK_ORDER overrides
  temperature: 0
  primary_timeout_s: 25            # a slower primary call fails over to the next provider (no retry)
  timeout_s: 60                    # fallback providers
  max_retries: 2
  max_output_tokens: 8192          # per chat request; includes tool arguments / generated code

jev:
  enabled: true                    # env JEV_ENABLED overrides
  min_confidence: 0.5              # below this the email says the sentiment signal is unclear
  consistency_threshold: 0.3       # guard rejects a paragraph Jev rates below this (calibrated: see scripts/eval_guard.py)
  speculation_threshold: 0.5       # guard rejects explanation sentences Jev rates above this as unsupported causal claims (scripts/eval_speculation.py)

sandbox:
  backend: docker                   # fail closed if unavailable; trusted_local is for reviewed test code only
  image: nasdaq-analysis:local
  memory_mb: 512
  cpus: 1
  timeout_s: 30
  max_attempts: 3
  max_stdout_chars: 10000

run:
  deadline_s: 420                  # cooperative deadline between stages; tools also have their own timeouts
  max_llm_calls: 30
  max_guard_rejections: 2
  recursion_limit: 60
  breaker_failures: 3              # consecutive failures before a provider is skipped for the run
  output_dir: outputs

budget:
  max_model_requests: null         # opt-in: all model attempts, including retries, sentiment and Jev
  max_total_tokens: null           # opt-in: estimated admission; actual usage settles reservations
  max_estimated_cost_usd: null     # opt-in; requires a price for EVERY configured model used
  prices: {}                      # provider:model -> version, input/output_per_million, optional cached rate/per_request

email:
  to: []                           # empty -> EMAIL_TO from .env
  dry_run: true                    # env EMAIL_DRY_RUN / CLI --send override
  include_chart: true
  narrative_max_words: 250         # upper bound only; no minimum length or padding
